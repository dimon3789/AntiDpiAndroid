name: Build Anti-DPI Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
          log-accepted-android-sdk-licenses: false

      - name: Build native ByeDPI (libciadpi.so)
        run: |
          chmod +x scripts/build_ciadpi_android.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"           ABIS="arm64-v8a armeabi-v7a"           ./scripts/build_ciadpi_android.sh
          ls -lh app/src/main/jniLibs/arm64-v8a/libciadpi.so
          ls -lh app/src/main/jniLibs/armeabi-v7a/libciadpi.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AntiDpiProxy-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiDpiProxy-debug-apk
          path: AntiDpiProxy-debug.apk
          retention-days: 30

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" AntiDpiProxy-debug.apk             --title "Anti-DPI Proxy ${GITHUB_REF_NAME}"             --notes "Автоматическая сборка APK с нативным движком ByeDPI (arm64-v8a, armeabi-v7a)."
